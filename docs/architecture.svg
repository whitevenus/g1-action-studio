x="0" role="button" aria-label="preflight.py · 只读预检"><rect x="30" y="260" width="260" height="115" rx="12" fill="#F1F7F3" stroke="#A2BDAA" stroke-width="1.5"/><text class="title" x="46" y="289">preflight.py · 只读预检</text><text class="line" x="46" y="314">查询运控与手臂服务</text><text class="line" x="46" y="336">观测状态与手臂命令话题</text><text class="line" x="46" y="358">保存预检报告</text></g><g class="node" id="read_sdk" data-route="observe" tabindex="0" role="button" aria-label="官方 SDK · 只读接口"><rect x="30" y="450" width="260" height="115" rx="12" fill="#F1F7F3" stroke="#A2BDAA" stroke-width="1.5"/><text class="title" x="46" y="479">官方 SDK · 只读接口</text><text class="line" x="46" y="504">RPC：模式、FSM、服务状态</text><text class="line" x="46" y="526">DDS：订阅 rt/lowstate</text><text class="line" x="46" y="548">预检还观测 rt/arm_sdk</text></g><g class="node" id="teach" data-route="teach" tabindex="0" role="button" aria-label="teach.py · teach()"><rect x="330" y="260" width="260" height="115" rx="12" fill="#FFF5EF" stroke="#E5AA91" stroke-width="1.5"/><text class="title" x="346" y="289">teach.py · teach()</text><text class="line" x="346" y="314">回车开始 / 结束录制</text><text class="line" x="346" y="336">保持终点 → 恢复刚度 → 联合回位</text><text class="line" x="346" y="358">实测稳定后渐变释放</text></g><g class="node" id="teach_port" data-route="teach" tabindex="0" role="button" aria-label="teach.py · SdkArmPort"><rect x="330" y="450" width="260" height="115" rx="12" fill="#FFF5EF" stroke="#E5AA91" stroke-width="1.5"/><text class="title" x="346" y="479">teach.py · SdkArmPort</text><text class="line" x="346" y="504">订阅反馈、检查服务</text><text class="line" x="346" y="526">组装双臂目标与分侧增益</text><text class="line" x="346" y="548">publisher.Write(command)</text></g><g class="node" id="teach_sdk" data-route="teach" tabindex="0" role="button" aria-label="官方 SDK · 示教通信"><rect x="330" y="660" width="260" height="95" rx="12" fill="#FFF5EF" stroke="#E5AA91" stroke-width="1.5"/><text class="title" x="346" y="689">官方 SDK · 示教通信</text><text class="line" x="346" y="714">ChannelSubscriber / Publisher</text><text class="line" x="346" y="736">RPC 查询 + DDS 命令发送</text></g><g class="node" id="author" data-route="offline replay collision" tabindex="0" role="button" aria-label="author.py · 轨迹整理"><rect x="630" y="260" width="260" height="115" rx="12" fill="#F7F3FA" stroke="#C5B3CD" stroke-width="1.5"/><text class="title" x="646" y="289">author.py · 轨迹整理</text><text class="line" x="646" y="314">load_action：录制 / 统一动作</text><text class="line" x="646" y="336">录制裁剪与 50 Hz 重采样</text><text class="line" x="646" y="358">加载时自动检查，无独立 audit</text></g><g class="node" id="plan" data-route="offline replay collision" tabindex="0" role="button" aria-label="replay.py · 回放规划"><rect x="630" y="450" width="260" height="115" rx="12" fill="#F7F3FA" stroke="#C5B3CD" stroke-width="1.5"/><text class="title" x="646" y="479">replay.py · 回放规划</text><text class="line" x="646" y="504">create_plan / build_schedule</text><text class="line" x="646" y="526">接管 → 进入 → 播放 → 回位 → 释放</text><text class="line" x="646" y="548">插值与角度、速度、加速度检查</text></g><g class="node" id="limits" data-route="offline replay" tabindex="0" role="button" aria-label="resources/ · 关节范围"><rect x="630" y="660" width="260" height="95" rx="12" fill="#F7F3FA" stroke="#C5B3CD" stroke-width="1.5"/><text class="title" x="646" y="689">resources/ · 关节范围</text><text class="line" x="646" y="714">g1_arm7_limits.xml</text><text class="line" x="646" y="736">提供 14 个手臂关节的角度上下限</text></g><g class="node" id="live" data-route="replay" tabindex="0" role="button" aria-label="live_replay.py · replay()"><rect x="930" y="260" width="260" height="115" rx="12" fill="#FFF5EF" stroke="#E5AA91" stroke-width="1.5"/><text class="title" x="946" y="289">live_replay.py · replay()</text><text class="line" x="946" y="314">按文件参数顺序编排动作</text><text class="line" x="946" y="336">自动规划进入 / 衔接 / 回位</text><text class="line" x="946" y="358">--execute 才进入真机执行</text></g><g class="node" id="executor" data-route="replay" tabindex="0" role="button" aria-label="executor.py · 执行与反馈"><rect x="930" y="450" width="260" height="115" rx="12" fill="#FFF5EF" stroke="#E5AA91" stroke-width="1.5"/><text class="title" x="946" y="479">executor.py · 执行与反馈</text><text class="line" x="946" y="504">execute_replay(plan, profile, port…)</text><text class="line" x="946" y="526">约 50 Hz：读反馈 → 检查 → 发目标</text><text class="line" x="946" y="548">回位稳定、取消、异常恢复释放</text></g><g class="node" id="replay_port" data-route="replay" tabindex="0" role="button" aria-label="replay_sdk.py · 回放端口"><rect x="930" y="660" width="260" height="95" rx="12" fill="#FFF5EF" stroke="#E5AA91" stroke-width="1.5"/><text class="title" x="946" y="689">replay_sdk.py · 回放端口</text><text class="line" x="946" y="714">snapshot() 读取反馈快照</text><text class="line" x="946" y="736">write() 组装命令、CRC、Write</text></g><g class="node" id="binding" data-route="replay" tabindex="0" role="button" aria-label="unitree_binding.py"><rect x="930" y="820" width="260" height="90" rx="12" fill="#FFF5EF" stroke="#E5AA91" stroke-width="1.5"/><text class="title" x="946" y="849">unitree_binding.py</text><text class="line" x="946" y="874">UnitreeReplaySDK → 官方 SDK</text><text class="line" x="946" y="896">默认离线；真机执行时开启网络</text></g><g class="node" id="transition" data-route="collision" tabindex="0" role="button" aria-label="transition.py · 动作衔接"><rect x="1230" y="260" width="260" height="115" rx="12" fill="#F7F3FA" stroke="#C5B3CD" stroke-width="1.5"/><text class="title" x="1246" y="289">transition.py · 动作衔接</text><text class="line" x="1246" y="314">动作 A → 避碰过渡 → 动作 B</text><text class="line" x="1246" y="336">直连失败 → RRTConnect</text><text class="line" x="1246" y="358">复用 author / replay 的轨迹工具</text></g><g class="node" id="collision" data-route="collision replay teach" tabindex="0" role="button" aria-label="collision.py · 几何检查"><rect x="1230" y="450" width="260" height="115" rx="12" fill="#F7F3FA" stroke="#C5B3CD" stroke-width="1.5"/><text class="title" x="1246" y="479">collision.py · 几何检查</text><text class="line" x="1246" y="504">clearance / edge_clear 几何检查</text><text class="line" x="1246" y="526">OMPL 搜索 / B-spline 平滑</text><text class="line" x="1246" y="548">示教回位 / 整段回放共用</text></g><g class="node" id="mujoco" data-route="collision" tabindex="0" role="button" aria-label="OMPL / MuJoCo"><rect x="1230" y="660" width="260" height="95" rx="12" fill="#F7F3FA" stroke="#C5B3CD" stroke-width="1.5"/><text class="title" x="1246" y="689">OMPL / MuJoCo</text><text class="line" x="1246" y="714">RRTConnect 搜索 / FK 与几何距离</text><text class="line" x="1246" y="736">Linux 规划依赖，不连接 DDS</text></g><g class="node" id="offline_output" data-route="collision" tabindex="0" role="button" aria-label="统一动作 JSON"><rect x="1230" y="820" width="260" height="90" rx="12" fill="#F7F3FA" stroke="#C5B3CD" stroke-width="1.5"/><text class="title" x="1246" y="849">统一动作 JSON</text><text class="line" x="1246" y="874">kind=single / sequence</text><text class="line" x="1246" y="896">两种动作均由 replay 执行</text></g><g class="node" id="robot" data-route="observe teach replay" tabindex="0" role="button" aria-label="外部系统 · 宇树 G1 + 官方 SDK2 / CycloneDDS"><rect x="30" y="1000" width="1160" height="100" rx="12" fill="#F1F7F3" stroke="#A2BDAA" stroke-width="1.5"/><text class="title" x="46" y="1029">外部系统 · 宇树 G1 + 官方 SDK2 / CycloneDDS</text><text class="line" x="46" y="1054">绿色返回：rt/lowstate + rt/dex3/*/state 的实测角度/速度；RPC 返回服务状态</text><text class="line" x="46" y="1076">橙色发送：rt/arm_sdk 的目标 q / kp / kd / 权重；手臂 J15–J28/权重29 + 独立Dex3-1命令话题</text></g><g class="node" id="files" data-route="all" tabindex="0" role="button" aria-label="本地文件 · examples/ 输入样本与参数 → data/ 个人录制、动作和执行报告"><rect x="30" y="1170" width="1460" height="95" rx="12" fill="#FCFCFB" stroke="#D9D5CF" stroke-width="1.5"/><text class="title" x="46" y="1199">本地文件 · examples/ 输入样本与参数 → data/ 个人录制、动作和执行报告</text><text class="line" x="46" y="1224">JSON 保存 q / dq / t、参数、轨迹摘要与反馈；现有输出不覆盖。constants.py 保存机型与关节布局。</text><text class="line" x="46" y="1246">项目是本地 Python 命令行工具：没有 Web 前端、API 服务、数据库或后台任务队列。</text></g><g class="node" id="shared" data-route="all" tabindex="0" role="button" aria-label="公共实现 · constants.py / trajectory.py / config.py"><rect x="30" y="1310" width="1460" height="100" rx="12" fill="#FCFCFB" stroke="#D9D5CF" stroke-width="1.5"/><text class="title" x="46" y="1339">公共实现 · constants.py / trajectory.py / config.py</text><text class="line" x="46" y="1364">常量与关节布局 · 轨迹差分、插值、平滑和摘要 · 参数一次读取与校验 · JSON 输出不覆盖</text><text class="line" x="46" y="1386">业务模块直接调用公共函数；unitree_binding.py 共用服务查询、客户端初始化、反馈快照与通道清理。</text></g><g class="node" id="tests" data-route="tests" tabindex="0" role="button" aria-label="tests/ + .github/workflows/"><rect x="30" y="1510" width="1460" height="115" rx="12" fill="#FCFCFB" stroke="#D9D5CF" stroke-width="1.5"/><text class="title" x="46" y="1539">tests/ + .github/workflows/</text><text class="line" x="46" y="1564">合成数据、tests/fake_sdk.py、正常与故障回归</text><text class="line" x="46" y="1586">Python 3.11 / OMPL + MuJoCo 作业</text><text class="line" x="46" y="1608">缺少可选依赖时明确跳过</text></g><text x="35" y="1460" font-size="19" font-weight="650" fill="#615B56">回归测试 · tests/fake_sdk.py 提供内存替身，不随项目安装</text><text x="35" y="1655" font-size="13" fill="#888078">实线：主调用或处理路径　·　虚线：资源输入　·　绿色：设备反馈　·　橙色：实际命令发送　|　图中不展开所有 import 依赖</text></svg>