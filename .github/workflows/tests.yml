name: 离线测试
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . ruff==0.16.8
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m unittest discover -s tests -v
      - run: g1-action-studio --help
  collision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[planning]'
      - name: Arm7 complete offline user flow (no dependency skips)
        env:
          G1_REQUIRE_PLANNING: '1'
        run: python -m unittest discover -s tests -p 'test_arm7_flow.py' -v
      - run: python -m unittest discover -s tests -v
