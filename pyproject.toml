[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-action-studio"
version = "0.1.0"
description = "宇树 G1 Arm7 动作预检、录制、示教与回放工具"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "whitevneus"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["build>=1.0"]
planning = [
  "mujoco>=3.15,<4",
  "ompl==2.0.1; sys_platform == 'linux'",
]

[project.scripts]
g1-action-studio = "g1_action_studio.cli:main"

[tool.setuptools]
packages = ["g1_action_studio"]
package-dir = {g1_action_studio = "src"}
include-package-data = false
license-files = ["LICENSE", "LICENSE-UNITREE", "LICENSE-UNITREE-MODEL", "LICENSE-APACHE-2.0"]

[tool.setuptools.package-data]
g1_action_studio = ["resources/*.xml", "resources/collision/*.xml", "resources/collision/*.json", "resources/collision/meshes/*.STL"]
