[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-action-studio"
version = "0.1.0"
description = "G1 单臂、双臂及双臂加腰动作的规划、预览与回放"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "whitevneus"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.16.3,<1.17"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["build>=1.0"]
planning = [
  "mujoco>=3.15,<4",
  "ompl==2.0.1; sys_platform == 'linux'",
]

[project.scripts]
g1-action-studio = "g1_action_studio.cli:main"

[tool.setuptools]
include-package-data = false
license-files = ["LICENSE", "LICENSE-UNITREE", "LICENSE-UNITREE-MODEL", "LICENSE-APACHE-2.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["g1_action_studio"]

[tool.setuptools.package-data]
g1_action_studio = ["resources/*.xml", "resources/*.md", "resources/LICENSE", "resources/meshes/*.STL"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["g1_action_studio"]

[tool.ruff.format]
quote-style = "double"
line-ending = "cr-lf"
